# QRClaw Gateway — Nginx reverse proxy template
#
# Usage:
#   1. Copy to /etc/nginx/sites-available/gateway.qrclaw.ai
#   2. Replace ${DOMAIN} with your actual domain
#   3. Replace ${SSL_CERT_PATH} / ${SSL_KEY_PATH} with Let's Encrypt paths
#   4. ln -s /etc/nginx/sites-available/gateway.qrclaw.ai /etc/nginx/sites-enabled/
#   5. nginx -t && systemctl reload nginx

upstream gateway_backend {
    # PM2 cluster instances all listen on the same port
    server 127.0.0.1:3001;

    # Sticky sessions for WebSocket (ip_hash or use cookie-based)
    ip_hash;

    keepalive 64;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=ws_conn:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_req:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=ws_active:10m;

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${DOMAIN};

    # ─── SSL ──────────────────────────────────────────────
    ssl_certificate     ${SSL_CERT_PATH};
    ssl_certificate_key ${SSL_KEY_PATH};
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ─── Security headers (supplement Express helmet) ─────
    add_header X-Request-ID $request_id always;

    # ─── WebSocket endpoint ───────────────────────────────
    location /ws {
        limit_req zone=ws_conn burst=5 nodelay;
        limit_conn ws_active 100;

        proxy_pass http://gateway_backend;
        proxy_http_version 1.1;

        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # WebSocket timeouts — keep alive longer than app-level ping (25s)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Disable buffering for real-time streaming
        proxy_buffering off;
    }

    # ─── HTTP API endpoints ───────────────────────────────
    location / {
        limit_req zone=api_req burst=20 nodelay;

        proxy_pass http://gateway_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        # Keepalive to upstream
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ─── Health check (no rate limit) ─────────────────────
    location = /health {
        proxy_pass http://gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # ─── Static deny ─────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
